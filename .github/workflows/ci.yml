name: CI Pipeline

on:
  push:
    branches: [ main, finalll, wire-module2-m3 ]
  pull_request:
    branches: [ main, finalll ]

jobs:
  test-and-lint:
    name: Pytest, Lint & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit moto boto3

      - name: Run Pytest
        run: |
          python -m pytest m3 -v

      - name: Run Ruff Linter
        run: |
          ruff check m3/

      - name: Run Bandit Security Scanner
        run: |
          bandit -r m3/ -ll -x "m3/tests/" || true

      - name: Run Pip-Audit Dependency Vulnerability Check
        run: |
          pip-audit || true

  terraform-check:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: |
          terraform -chdir=infra/terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build M3 Sidecar Docker Image
        run: |
          docker build -t dinsec-m3-sidecar:latest .
