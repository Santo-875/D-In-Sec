# ==============================================================
# D-In-Sec — GitLab CI/CD (M3 sidecar + mock portal + Terraform)
# Stages: lint -> test -> security -> infra -> build
# ==============================================================

stages:
  - lint
  - test
  - security
  - infra
  - build

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TF_DIR: "infra/terraform"
  # Local backends only in CI: no AWS credentials needed
  STORAGE_BACKEND: "local"
  SIGNER_BACKEND: "local"

# GitLab built-in scanners (SAST + secret detection)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Run on merge requests and on main / final_integ pushes; avoid duplicate pipelines
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "final_integ"

default:
  interruptible: true

.python:
  image: python:${PYTHON_VERSION}-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install python-dotenv pytest ruff bandit pip-audit "moto[s3,kms]" boto3
    - if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

# ---------------- LINT ----------------
ruff:
  extends: .python
  stage: lint
  script:
    - ruff check m3/

# ---------------- TEST ----------------
pytest-m3:
  extends: .python
  stage: test
  script:
    - python -m pytest m3 -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# Portal syntax check (the mock site is not covered by pytest m3)
mock-site-compile:
  image: python:${PYTHON_VERSION}-slim
  stage: test
  script:
    - python -m compileall -q mock_site m3

# ---------------- SECURITY ----------------
bandit:
  extends: .python
  stage: security
  script:
    - bandit -r m3/ mock_site/ -ll -x "m3/tests/" -f json -o bandit-report.json || EXIT=$?
    - bandit -r m3/ mock_site/ -ll -x "m3/tests/" || true
    - exit ${EXIT:-0}
  allow_failure: true # flip to false once findings are triaged
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 1 week

pip-audit:
  extends: .python
  stage: security
  script:
    - pip-audit -r requirements.txt -r mock_site/requirements.txt
  allow_failure: true # flip to false once findings are triaged

# ---------------- INFRA ----------------
terraform-validate:
  stage: infra
  image:
    name: hashicorp/terraform:1.6
    entrypoint: [""]
  script:
    - terraform -chdir=${TF_DIR} fmt -check -recursive
    - terraform -chdir=${TF_DIR} init -backend=false
    - terraform -chdir=${TF_DIR} validate
  rules:
    - changes:
        - infra/terraform/**/*
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "final_integ"

# ---------------- BUILD ----------------
.docker-build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f "$DOCKERFILE" -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    # Push only from main / final_integ (not from merge requests)
    - |
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag  "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
          docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
        fi
      fi

build-m3-sidecar:
  extends: .docker-build
  variables:
    DOCKERFILE: Dockerfile
    IMAGE_NAME: m3-sidecar

build-mock-portal:
  extends: .docker-build
  variables:
    DOCKERFILE: mock_site/Dockerfile
    IMAGE_NAME: mock-portal
